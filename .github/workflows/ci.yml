name: Package CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
jobs:
  php:
    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.1', '8.2', '8.3', '8.4', '8.5', '8.6']
    runs-on: ubuntu-26.04
    env:
      LEKALO_PHP_SRC: ${{ github.workspace }}/.ci/lekalo-php/src
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: ichinya/lekalo-php
          ref: 04a88f7f19007635a760a9ec3071e8e6662e984a
          path: .ci/lekalo-php
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: tokenizer
          tools: none
      - run: php -n tests/laravel.php
      - name: The unified artifact answers describe on this version
        run: |
          set -euo pipefail
          printf '%s' '{"protocol":"lekalo.target/v1","protocol_version":"0.6.4","operation":"describe","request_id":"req-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa","project_root":"."}' \
            | php -n compat/adapter.php | grep -q '"version":"0.9.0"'
      - run: php -n compat/build.php --check
      - run: php -n compat/tests/process.php
  attachments:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked --manifest-path crates/attachments/Cargo.toml
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: tokenizer
          tools: none
      - uses: ichinya/lekalo-adapter-sdk/.github/actions/package-contract@727243fd12b0eb52409ddb41d8bbbfa143098191
        with:
          host: 9eb07ce8f21f96a9a160d382ac6280b9fa0fbcbe

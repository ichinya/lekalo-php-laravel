name: Host integration
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
jobs:
  compatibility:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: ichinya/lekalo-adapter-sdk/.github/actions/stage-host-tests@ebe6ce17bd948d52850fb1a600e07a1ddbee7062
        with:
          host: 9eb07ce8f21f96a9a160d382ac6280b9fa0fbcbe
      - name: Provision pinned external integration packages
        run: node scripts/external-tool.mjs --provision
      - name: Use physical temporary paths for synthetic project fixtures
        run: |
          node --input-type=module <<'NODE'
          import {appendFileSync, realpathSync} from 'node:fs';
          import {tmpdir} from 'node:os';
          // The native Windows resolver also expands 8.3 names.
          const root = realpathSync.native(tmpdir());
          for (const name of ['TEMP', 'TMP', 'TMPDIR']) {
            appendFileSync(process.env.GITHUB_ENV, `${name}=${root}\n`);
          }
          NODE
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the pinned host and its selected fixture services
        shell: bash
        run: |
          set -euo pipefail
          node scripts/external-tool.mjs --build-services
          cargo build --locked -p lekalo-cli --bins
          node -e 'const p=require("node:path"), fs=require("node:fs"), ext=process.platform==="win32"?".exe":""; for(const [k,n] of [["LEKALO_BIN","lekalo"],["LEKALO_DEBUG_BIN","lekalo"],["LEKALO_SDK_ORACLE","adapter-sdk-oracle"]]) fs.appendFileSync(process.env.GITHUB_ENV,k+"="+p.resolve("target/debug/"+n+ext)+"\n")'
      - name: Provision PHP 8.3 (issue #54, visible setup step, no project install)
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          # Composer is needed on every OS by the issue #56 fixture
          # provisioning step (the locked vendor tree is not committed).
          tools: composer
          # The locked Laravel runtime of the issue #56 fixture needs its
          # platform extensions; every dependency-free suite is unaffected.
          extensions: mbstring, openssl, pdo_sqlite, sqlite3, tokenizer, xml, dom, xmlwriter, ctype, fileinfo, iconv, session
        id: php
      - name: Provision exact Ajv 8.20.0 outside the checkout (issues #32, #48)
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/lekalo-ajv-8.20.0" --ignore-scripts --no-audit --no-fund --no-save ajv@8.20.0
          export NODE_PATH="$RUNNER_TEMP/lekalo-ajv-8.20.0/node_modules"
          test "$(node -p "require('ajv/package.json').version")" = "8.20.0"
      - name: Provision the Linux process confinement backend
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes bubblewrap ripgrep
      - name: Load the CI-only AppArmor launcher prerequisite
        if: runner.os == 'Linux'
        id: apparmor
        timeout-minutes: 1
        run: |
          set -euo pipefail
          bash .github/ci/bwrap-apparmor.sh load
      - name: Verify the Linux namespace backend before adapter probes
        if: runner.os == 'Linux'
        run: /usr/bin/bwrap --unshare-all --ro-bind / / --dev /dev --proc /proc /bin/true
      - name: Provision the vendored compiler bundle custody (issue #44)
        run: |
          set -euo pipefail
          npm ci --prefix "$LEKALO_TYPESCRIPT_ROOT/adapters/node-typescript" --ignore-scripts --no-audit --no-fund
          node tests/external/lekalo-typescript/adapters/node-typescript/provision-compiler.mjs
          node tests/external/lekalo-typescript/adapters/node-typescript/build.mjs --check
      - name: Provision the planner fixture vendor tree per the committed lock (issues #52/#56)
        # Explicit setup, before both maintained-native and later adapter gates.
        # Runtime/compile processes never install packages or run lifecycle scripts.
        timeout-minutes: 15
        run: composer install --no-interaction --prefer-dist --no-scripts --working-dir tests/fixtures/php-laravel/planner
      - name: Run the task-links pilot gates (issue #52)
        env:
          LEKALO_AJV_NODE_PATH: ${{ runner.temp }}/lekalo-ajv-8.20.0/node_modules
        run: |
          set -euo pipefail
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-task-links-contracts.mjs
          node scripts/test-adapter-manifest-golden.mjs
          node scripts/test-task-links-scenarios.mjs
          node scripts/test-task-links-outbox.mjs
          node scripts/test-task-links-impact-portability.mjs
          node scripts/test-task-links-native.mjs
          node scripts/test-task-links-public-evidence.mjs
      - name: Run the provisioned task-links native gate (issue #52)
        # Executes the Rust/SQLite battery and the locked maintained Laravel
        # port in synchronized/killed/restarted worker processes. Only the live
        # owner can qualify its matching implementation/build/profile;
        # exported files/DB rows never authenticate a past native execution.
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          LEKALO_TASKLINKS_NATIVE=1 \
            LEKALO_TASKLINKS_NATIVE_DB="$RUNNER_TEMP/tasklinks-native/provisioned.sqlite" \
            node scripts/test-task-links-native.mjs
          test -f "$RUNNER_TEMP/tasklinks-native/provisioned.sqlite.qualified.json"
      - name: Run the PHP types contract gate (issue #58)
        env:
          LEKALO_AJV_NODE_PATH: ${{ runner.temp }}/lekalo-ajv-8.20.0/node_modules
        run: node scripts/test-php-types-contracts.mjs
      - name: Run the PHP/Laravel adapter suite (issue #54)
        # Runs on every OS: the PHP unit suites and packaging gate run
        # wherever PHP runs; the confined conformance battery proves for
        # real on Linux, and on macOS/Windows reports the platform's
        # confinement limitation as an explicit, logged skip.
        timeout-minutes: 10
        run: node scripts/test-php-laravel-adapter.mjs
      - name: Run the PHP scenario binding custody gate (issue #56)
        # Scaffold-once and checked-binding semantics over the pure
        # compile exchange — needs PHP only, no vendor tree: generation
        # and verification never execute project code.
        timeout-minutes: 10
        run: node scripts/test-php-laravel-scenario-bindings.mjs
      - name: Run the PHP type generation gate (issue #58)
        # The closed mapping, the three custody modes, and the golden
        # digests over the shared Planner corpus — needs PHP only.
        timeout-minutes: 10
        run: node scripts/test-php-laravel-types.mjs
      - name: Run the PHP type round-trip gate (issue #58)
        # Executable codec vectors over both corpora; the Mago leg
        # records an honest skip here (the real-toolchain leg runs it
        # with --require-mago) and never counts as Mago acceptance.
        timeout-minutes: 10
        run: node scripts/test-php-laravel-type-roundtrip.mjs
      - name: Run the Composer/Laravel native-gates harness (issue #61)
        # Pure planner legs on every OS: targeted selection, mandatory
        # cross-module gates, exactly-once suites, hostile decoder
        # probes, stale-custody zero-spawn refusals, and the release-
        # full fallback — driven in-process with process-launching
        # functions disabled, so zero-spawn claims are enforced by the
        # interpreter. The Rust `native run` parity leg runs when the
        # built binary is present; the confined runtime qualification
        # leg stays pending its operator/CI provisioning (research doc
        # section 8.5) and never fakes a pass.
        timeout-minutes: 10
        run: node scripts/test-php-laravel-native-gates.mjs
      - name: Run the Laratesto scenario E2E gate (issue #56)
        timeout-minutes: 10
        run: node scripts/test-php-laravel-scenario-tests.mjs
      - name: Run the Laravel routes runtime gate (issue #60)
        # The composed types + operations + routes generation through
        # the real adapter exchange, then the planner fixture serving
        # the Today/focus endpoints through the generated surface over
        # the real HTTP kernel (the provisioned vendor tree above).
        timeout-minutes: 15
        run: node scripts/test-php-laravel-routes.mjs
      - name: Run the Laravel migration pipeline gate (issue #57)
        # The pipeline stages (CLI goldens, PHP artifacts, custody)
        # run wherever the repo's gates run; the PostgreSQL execution
        # stage uses the docker engine available on the runner and
        # records an explicit skip when it is absent — never a pass.
        timeout-minutes: 15
        run: node scripts/test-php-laravel-migrations.mjs
      - name: Run the Node/Laravel scenario parity gate (issue #56)
        # Both backends run the same committed scenario corpus under
        # their real runners; the durable run records must normalize to
        # identical semantic row tuples, including the shared failing
        # mutation.
        timeout-minutes: 10
        run: node scripts/test-php-laravel-parity.mjs
      - name: Check Laravel schemas and cross-runtime rule portability
        run: |
          export LEKALO_AJV_NODE_PATH="$(node -p 'require("node:path").join(process.env.RUNNER_TEMP,"lekalo-ajv-8.20.0/node_modules")')"
          export NODE_PATH="$LEKALO_AJV_NODE_PATH"
          node scripts/test-php-operations-contracts.mjs
          node scripts/test-laravel-migration-contracts.mjs
          node --test scripts/test-portable-laravel.mjs
      - name: Provision the pinned Go toolchain for the client-SDK gate (issue #72)
        uses: actions/setup-go@v7
        with:
          go-version: "1.23.5"
          # The SDK gate creates its Go module in a disposable directory.
          # There is no repository-root dependency file to use as a cache key.
          cache: false
      - name: "Provision the locked tutorial Vue runtime"
        run: |
          npm install --prefix "$RUNNER_TEMP/lekalo-client-sdk-vue" --ignore-scripts --no-audit --no-fund --no-save typescript@5.9.3 @vue/compiler-sfc@3.4.38
      - name: Replay the Laravel and Vue tutorial in a disposable copy (issue #105)
        timeout-minutes: 20
        env:
          NODE_PATH: ${{ runner.temp }}/lekalo-ajv-8.20.0/node_modules
        run: |
          set -euo pipefail
          delim=":"; if [ "$RUNNER_OS" = "Windows" ]; then delim=";"; fi
          NODE_PATH="$NODE_PATH$delim$RUNNER_TEMP/lekalo-client-sdk-vue/node_modules" node scripts/test-docs-examples.mjs --lane planner
      - name: Run the adapter integration tests through Cargo
        run: |
          cargo test --locked -p lekalo-cli --test package_adoption
          cargo test --locked -p lekalo-core --test php_laravel_kernel
          cargo test --locked -p lekalo-cli --test php_types_pipeline
      - name: Remove the CI-only AppArmor launcher prerequisite
        if: always() && runner.os == 'Linux'
        timeout-minutes: 1
        run: |
          set -euo pipefail
          bash .github/ci/bwrap-apparmor.sh remove
          test "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)" = 1
          if sudo grep -Eq '^lekalo-ci-bwrap(-child)? ' /sys/kernel/security/apparmor/profiles; then
            exit 1
          fi

  postgres-migrations:
    name: PostgreSQL migration execution lane (issue #57)
    # The migration gate's stage 3 executes the emitted up()/down()
    # SQL on a real server. The build-test lanes reach it only when a
    # docker engine happens to exist; this job provisions a
    # digest-pinned services: PostgreSQL and hands it to the harness
    # through LEKALO_MIGRATIONS_PG*, so execution is guaranteed and
    # the server version stops floating with the postgres:16-alpine
    # tag. A configured-but-unreachable service fails the harness
    # (db:service-execution) — never a silent skip.
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
        env:
          POSTGRES_DB: lekalo
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d lekalo"
          --health-interval=10s --health-timeout=5s --health-retries=20
    steps:
      - uses: ichinya/lekalo-adapter-sdk/.github/actions/stage-host-tests@ebe6ce17bd948d52850fb1a600e07a1ddbee7062
        with:
          host: 9eb07ce8f21f96a9a160d382ac6280b9fa0fbcbe
      - name: Provision pinned external integration packages
        run: node scripts/external-tool.mjs --provision
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        if: runner.environment == 'github-hosted'
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          package-manager-cache: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: none
          extensions: none
      - name: Provision the PostgreSQL client tools
        # The harness drives the service through the runner's psql;
        # ubuntu-latest ships it, the self-hosted image may not.
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes postgresql-client
          fi
          psql --version
          pg_isready --version
      - name: Build the locked CLI and run the migration pipeline gate
        env:
          LEKALO_MIGRATIONS_PGHOST: localhost
          LEKALO_MIGRATIONS_PGPORT: '5432'
          LEKALO_MIGRATIONS_PGUSER: postgres
          LEKALO_MIGRATIONS_PGPASSWORD: synthetic-ci-only
          LEKALO_MIGRATIONS_PGDATABASE: lekalo
        run: |
          set -euo pipefail
          cargo build -p lekalo-cli --locked
          node scripts/test-php-laravel-migrations.mjs

  worklog-changelog-pilot:
    name: Worklog-changelog pilot binary gates (issue #51)
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: ichinya/lekalo-adapter-sdk/.github/actions/stage-host-tests@ebe6ce17bd948d52850fb1a600e07a1ddbee7062
        with:
          host: 9eb07ce8f21f96a9a160d382ac6280b9fa0fbcbe
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        if: runner.environment == 'github-hosted'
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          package-manager-cache: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
      - name: Provision pinned external integration packages
        run: node scripts/external-tool.mjs --provision
      - name: Build pinned external services
        run: node scripts/external-tool.mjs --build-services
      - name: Build the locked CLI and provision the exact schema validator
        run: |
          set -euo pipefail
          cargo build -p lekalo-cli --locked
          npm install --prefix "$RUNNER_TEMP/lekalo-ajv-8.20.0" --ignore-scripts --no-audit --no-fund --no-save ajv@8.20.0
      - name: Run the pilot harness, impact, and neutrality gates
        env:
          LEKALO_AJV_NODE_PATH: ${{ runner.temp }}/lekalo-ajv-8.20.0/node_modules
        run: |
          set -euo pipefail
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-worklog-changelog-pilot.mjs --target php --profile strict --case all
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-worklog-changelog-pilot.mjs --target go --profile strict --case all --expect-denied
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-worklog-changelog-pilot.mjs --target go --profile permissive --case all
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-worklog-changelog-impact.mjs
          NODE_PATH="$LEKALO_AJV_NODE_PATH" node scripts/test-worklog-changelog-admission.mjs
          node scripts/test-worklog-changelog-neutrality.mjs

  mago-real:
    name: Mago real-toolchain gate (issue #55)
    # The real-toolchain leg: installs the checksum-pinned Mago release
    # as a visible setup step outside the checkout, then runs the real
    # suite with --require-available. A missing tool fails this job; a
    # skipped leg is visible and never counts as Mago acceptance.
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: ichinya/lekalo-adapter-sdk/.github/actions/stage-host-tests@ebe6ce17bd948d52850fb1a600e07a1ddbee7062
        with:
          host: 9eb07ce8f21f96a9a160d382ac6280b9fa0fbcbe
      - name: Install the pinned PHP packages and compatibility artifact
        run: node scripts/external-tool.mjs --provision-php
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          package-manager-cache: false
      - name: Provision PHP 8.3 (no extensions, no Composer tools)
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: none
          extensions: none
      - name: Install the pinned Mago toolchain (checksum-verified, outside the checkout)
        run: |
          set -euo pipefail
          LOCK=tests/external/lekalo-php/mago-toolchain.lock.json
          PIN_VERSION=$(node -p "require('./$LOCK').tool.version")
          test "$PIN_VERSION" = "1.0.0"
          # Resolve THIS runner's platform entry from the lock — the
          # digest is custody, not decoration.
          read -r _PLATFORM ARCHIVE WANT_SHA <<EOF
          $(node -e "
            const lock = require('./$LOCK');
            const platform = process.arch === 'arm64' && process.platform === 'darwin'
              ? 'aarch64-apple-darwin'
              : 'x86_64-unknown-linux-gnu';
            const artifact = lock.probe.artifacts.find((a) => a.platform === platform);
            if (!artifact) { console.error('no pinned artifact for ' + platform); process.exit(1); }
            console.log(artifact.platform, artifact.archive, artifact.archiveSha256);
          ")
          EOF
          ARCHIVE_CACHE="$RUNNER_TOOL_CACHE/mago-archives/$WANT_SHA/$ARCHIVE"
          if test -f "$ARCHIVE_CACHE"; then
            cp "$ARCHIVE_CACHE" "$RUNNER_TEMP/mago-archive"
          else
            curl -sSfL --retry 3 -o "$RUNNER_TEMP/mago-archive" \
              "https://github.com/carthage-software/mago/releases/download/${PIN_VERSION}/${ARCHIVE}"
          fi
          # Fail-closed verification: the downloaded archive must match
          # the pinned digest byte for byte, or the job stops here.
          echo "${WANT_SHA}  $RUNNER_TEMP/mago-archive" | sha256sum --check --strict
          if test -w "$RUNNER_TOOL_CACHE"; then
            mkdir -p "$(dirname "$ARCHIVE_CACHE")"
            cp "$RUNNER_TEMP/mago-archive" "$ARCHIVE_CACHE"
          fi
          mkdir -p "$RUNNER_TEMP/mago-bin"
          tar -xzf "$RUNNER_TEMP/mago-archive" -C "$RUNNER_TEMP/mago-bin"
          BIN=$(find "$RUNNER_TEMP/mago-bin" -type f -name mago | head -1)
          test -n "$BIN"
          chmod +x "$BIN"
          echo "LEKALO_MAGO=$BIN" >> "$GITHUB_ENV"
      - name: Run the generated-types Mago gate, real mode (issue #58)
        # The generated type files pass the pinned lint AND analyze
        # gates, with the violating negative control proving the rules
        # ran. A missing tool fails this leg, never a silent skip.
        run: node scripts/test-php-laravel-type-roundtrip.mjs --require-mago
